          maxLength: 260
          minLength: 1
          type: string
        name:
          maxLength: 200
          minLength: 1
          type: string
        settings:
          $ref: '#/components/schemas/Policy'
      required:
        - name
      type: object
    DeclarationReason:
      properties:
        code:
          type: string
        description:
          type: string
      required:
        - code
      type: object
    DeclarationState:
      properties:
        active:
          type: boolean
        identifier:
          type: string
        reasons:
          items:
            $ref: '#/components/schemas/DeclarationReason'
