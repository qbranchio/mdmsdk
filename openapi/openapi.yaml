          type: string
        last_seen_at:
          format: date-time
          type:
            - "null"
            - string
        member_id:
          description: The member who owns the device. Null when it is the tenant's.
          format: uuid
          type:
            - "null"
            - string
        model:
          type:
            - "null"
            - string
        name:
          type: string
        os_behind:
          description: Below its tenant's minimum, or below os_latest when the tenant sets none.
          type: boolean
        os_latest:
          description: The newest iOS Apple publishes for its model, from the daily check.
          type:
            - "null"
            - string
        os_version:
          type:
            - "null"
