          type: string
      required:
        - token
      type: object
    WebhookDelivery:
      properties:
        attempts:
          type: integer
        created_at:
          format: date-time
          type: string
        event_id:
          description: The webhook-id header.
          format: uuid
          type: string
        finished_at:
          format: date-time
          type: string
        id:
          format: uuid
          type: string
        last_error:
          type: string
        last_status:
          type: integer
        next_attempt_at:
          format: date-time
          type: string
        status:
          enum:
            - pending
            - delivered
            - failed
          type: string
        type:
          type: string
      required:
        - id
        - event_id
        - type
        - status
        - attempts
        - next_attempt_at
        - created_at
      type: object
    WebhookEndpoint:
      properties:
        created_at:
          format: date-time
          type: string
        disabled_reason:
          type: string
        enabled:
          type: boolean
        events:
          description: Empty takes every event.
          items:
            type: string
          type: array
        id:
          format: uuid
          type: string
        previous_secret_until:
          description: Until when deliveries are also signed with the previous secret.
          format: date-time
          type: string
        secret:
          description: The signing secret (whsec_...). Only on create and rotate.
          type: string
        updated_at:
          format: date-time
          type: string
        url:
          type: string
      required:
        - id
        - url
        - events
        - enabled
        - created_at
        - updated_at
      type: object
    WebhookEvent:
      description: 'The body of a webhook delivery: one event, told apart by type.'
      discriminator:
        mapping:
          command.completed: '#/components/schemas/CommandCompletedEvent'
          device.enrolled: '#/components/schemas/DeviceEnrolledEvent'
          device.os_behind: '#/components/schemas/DeviceOSBehindEvent'
          device.policy_status: '#/components/schemas/DevicePolicyStatusEvent'
          device.unenrolled: '#/components/schemas/DeviceUnenrolledEvent'
          push_certificate.expiring: '#/components/schemas/PushCertificateExpiringEvent'
          tenant.deleted: '#/components/schemas/TenantDeletedEvent'
          tenant.deleting: '#/components/schemas/TenantDeletingEvent'
        propertyName: type
      oneOf:
        - $ref: '#/components/schemas/DeviceEnrolledEvent'
        - $ref: '#/components/schemas/DeviceUnenrolledEvent'
        - $ref: '#/components/schemas/DevicePolicyStatusEvent'
        - $ref: '#/components/schemas/DeviceOSBehindEvent'
        - $ref: '#/components/schemas/CommandCompletedEvent'
        - $ref: '#/components/schemas/PushCertificateExpiringEvent'
        - $ref: '#/components/schemas/TenantDeletingEvent'
        - $ref: '#/components/schemas/TenantDeletedEvent'
    WebhookRequest:
      properties:
        events:
          items:
            enum:
              - device.enrolled
              - device.unenrolled
              - device.policy_status
              - device.os_behind
              - command.completed
              - push_certificate.expiring
              - tenant.deleting
              - tenant.deleted
            type: string
          type: array
        url:
          maxLength: 2048
          type: string
      required:
        - url
      type: object
    WebhookUpdate:
      minProperties: 1
      properties:
        enabled:
          type: boolean
        events:
          items:
            enum:
              - device.enrolled
              - device.unenrolled
              - device.policy_status
              - device.os_behind
              - command.completed
              - push_certificate.expiring
              - tenant.deleting
              - tenant.deleted
            type: string
          type: array
        url:
          maxLength: 2048
          type: string
      type: object
  securitySchemes:
    bearerAuth:
      description: A delegated token from POST /api/v1/tokens, or an admin app sign-in.
      scheme: bearer
