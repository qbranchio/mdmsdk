components:
  schemas:
    ADEPublicKey:
      properties:
        certificate:
          description: PEM.
          type: string
      required:
        - certificate
      type: object
    Account:
      properties:
        clients:
          description: Its Auth0 API client ids.
          items:
            type: string
          type: array
        contact_email:
          type: string
        id:
          format: uuid
          type: string
        name:
          type: string
        origins:
          description: Browser origins its users call the API from with delegated tokens.
          items:
            type: string
          type: array
      required:
        - id
        - name
        - contact_email
        - clients
        - origins
      type: object
    AccountRef:
      properties:
        id:
          format: uuid
          type: string
        name:
          type: string
      required:
        - id
        - name
      type: object
    Assignment:
      properties:
        created_at:
          format: date-time
          type: string
        id:
          format: uuid
          type: string
        levels:
          items:
            enum:
              - supervised
              - unsupervised
            type: string
          type: array
        profile_id:
          format: uuid
          type: string
        target:
          enum:
            - tenant
            - group
            - member
            - device
          type: string
        target_id:
          description: The group, member, or device id. Null for the tenant.
          format: uuid
          type:
            - "null"
            - string
      required:
        - id
        - profile_id
        - target
        - target_id
        - levels
        - created_at
      type: object
    AssignmentRequest:
      properties:
        levels:
          items:
            enum:
              - supervised
              - unsupervised
            type: string
          minItems: 1
          type: array
        target:
          enum:
            - tenant
            - group
            - member
            - device
          type: string
        target_id:
          description: The group or device id, or the member id or `ext:` and the account's id for the member. Not set for the tenant.
          maxLength: 260
          minLength: 1
          type: string
      required:
        - target
        - levels
      type: object
    AuditEvent:
      properties:
        account_id:
          format: uuid
          type: string
        action:
          description: The operation id; filter with `action`.
          type: string
        actor_display:
          description: A person's name (read from Auth0, else their subject), an account client's name or id, "Platform" (a platform admin's name for platform admins), "CLI", or an invitee's invited name.
          type: string
        actor_kind:
          description: admin, console, account, delegated, platform_admin, cli, or invitee.
          type: string
        actor_subject:
          description: The token's subject; filter with `actor`.
          type: string
        at:
          format: date-time
          type: string
        id:
          description: The event's id, stable.
          type: string
        resource_id:
          type: string
        resource_type:
          type: string
        scope:
          description: platform, account, or tenant.
          type: string
        summary:
          description: What was done, without who ("Sent Lock to Front desk iPad 2").
          type: string
        tenant_id:
          format: uuid
          type: string
      required:
        - id
        - at
        - scope
        - actor_kind
        - actor_subject
        - actor_display
        - action
        - summary
      type: object
    AuditPage:
      properties:
        events:
          items:
            $ref: '#/components/schemas/AuditEvent'
          type: array
        next_cursor:
          description: Pass as `cursor` for the next page; null on the last.
          type:
            - "null"
            - string
      required:
        - events
        - next_cursor
      type: object
    CatalogCond:
      description: 'A condition on another key of the payload. key is relative to the constrained key''s dictionary: "Name", "../Name" one level up, or "/Name" at the payload root. An unset key is compared by its default. Every field present must hold.'
      properties:
        in:
          items: {}
          type: array
        key:
          type: string
        not_in:
          items: {}
          type: array
        set:
          type: boolean
        title:
          type: string
      required:
        - key
        - title
      type: object
    CatalogEntry:
      properties:
        deprecated_os:
          type: string
        description:
          type: string
        group:
          enum:
            - apps
            - camera
            - messages
            - content
            - passcode
            - network
            - accounts
            - home
            - device
          type: string
        id:
          type: string
        keys:
          items:
            $ref: '#/components/schemas/CatalogKey'
          type: array
        kind:
          enum:
            - restriction
            - profile
            - declaration
          type: string
        levels:
          items:
            enum:
              - supervised
              - unsupervised
            type: string
          type: array
        min_os:
          type: string
        multiple:
          type: boolean
        title:
          type: string
        type:
          type: string
      required:
        - id
        - kind
        - type
        - title
        - description
        - group
        - levels
        - keys
      type: object
    CatalogKey:
      properties:
        default: {}
        deprecated_os:
          type: string
        description:
          type: string
        excludes:
          description: Sibling keys this key cannot be set with.
          items:
            type: string
          type: array
        format:
          description: Apple's subtype of a string key; the server checks values against it.
          enum:
            - url
            - hostname
          type: string
        items:
          $ref: '#/components/schemas/CatalogKey'
        keys:
          items:
            $ref: '#/components/schemas/CatalogKey'
          type: array
        levels:
          items:
            enum:
              - supervised
              - unsupervised
            type: string
          type: array
        min_os:
          type: string
        name:
          type: string
        options:
          items:
            $ref: '#/components/schemas/CatalogOption'
          type: array
        range:
          $ref: '#/components/schemas/CatalogRange'
        required:
          type: boolean
        required_when:
          description: The key is required while every condition holds.
          items:
            $ref: '#/components/schemas/CatalogCond'
          type: array
        secret:
          type: boolean
        title:
          type: string
        type:
          enum:
            - string
            - integer
            - real
            - boolean
            - date
            - data
            - array
            - dictionary
            - any
          type: string
        when:
          description: The key applies only while every condition holds; set otherwise, the server refuses it.
          items:
            $ref: '#/components/schemas/CatalogCond'
          type: array
      required:
        - name
        - type
      type: object
    CatalogOption:
      properties:
        label:
          type: string
        value: {}
      required:
        - value
        - label
      type: object
    CatalogRange:
      properties:
        max:
          type: number
        min:
          type: number
      type: object
    CatalogResponse:
      properties:
        entries:
          items:
            $ref: '#/components/schemas/CatalogEntry'
          type: array
      required:
        - entries
      type: object
    Command:
      properties:
        command_uuid:
          format: uuid
          type: string
        created_at:
          format: date-time
          type: string
        error:
          description: The device's ErrorChain.
          items:
            additionalProperties: {}
            type: object
          type:
            - "null"
            - array
        request_type:
          type: string
        result:
          additionalProperties: {}
          description: The device's report without UDID, Status, CommandUUID, and ErrorChain. For DeviceInformation it carries QueryResponses, for DeviceLock MessageResult when present.
          type:
            - "null"
            - object
        status:
          description: 'A command starts in the first status listed and stays there until it is handed to the MDM server. cancelled: it was dropped without being sent, because its enrollment ended or a newer decision replaced it. It never reached the device.'
          enum:
            - outbox
            - cancelled
            - queued
            - acknowledged
            - error
            - command_format_error
            - notnow
          type: string
        updated_at:
          format: date-time
          type: string
      required:
        - command_uuid
        - request_type
        - status
        - result
        - error
        - created_at
        - updated_at
      type: object
    CommandAccepted:
      properties:
        command_uuid:
          format: uuid
          type: string
      required:
        - command_uuid
      type: object
    CommandCompletedData:
      properties:
        command_uuid:
          format: uuid
          type: string
        device_id:
          format: uuid
          type: string
        member_id:
          description: The member who owns the device; null when it is the tenant's.
          format: uuid
          type:
            - "null"
            - string
        request_type:
          description: The command's type (DeviceLock, DeviceInformation, and the commands mdm sends itself).
          type: string
        status:
          enum:
            - acknowledged
            - error
            - command_format_error
          type: string
        tenant_external_id:
          description: The account's own id for the tenant; null when it has none.
          type:
            - "null"
            - string
        tenant_id:
          format: uuid
          type: string
      required:
        - tenant_id
        - tenant_external_id
        - device_id
        - member_id
        - command_uuid
        - request_type
        - status
      type: object
    CommandCompletedEvent:
      properties:
        data:
          $ref: '#/components/schemas/CommandCompletedData'
        timestamp:
          description: When the event happened.
          format: date-time
          type: string
        type:
          enum:
            - command.completed
          type: string
      required:
        - type
        - timestamp
        - data
      type: object
    CommandRequest:
      properties:
        message:
          description: DeviceLock only.
          maxLength: 1000
          type: string
        phone_number:
          description: DeviceLock only.
          maxLength: 64
          type: string
