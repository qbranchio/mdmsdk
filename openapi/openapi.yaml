components:
  schemas:
    AccountRef:
      properties:
        id:
          format: uuid
          type: string
        name:
          type: string
      required:
        - id
        - name
      type: object
    Assignment:
      properties:
        created_at:
          format: date-time
          type: string
        id:
          format: uuid
          type: string
        levels:
          items:
            enum:
              - supervised
              - unsupervised
            type: string
          type: array
        profile_id:
          format: uuid
          type: string
        target:
          enum:
            - tenant
            - group
            - member
            - device
          type: string
        target_id:
          description: The group, member, or device id. Null for the tenant.
          format: uuid
          type:
            - "null"
            - string
      required:
        - id
        - profile_id
        - target
        - target_id
        - levels
        - created_at
      type: object
    AssignmentRequest:
      properties:
        levels:
          items:
            enum:
              - supervised
              - unsupervised
            type: string
          minItems: 1
          type: array
        target:
          enum:
            - tenant
            - group
            - member
            - device
          type: string
        target_id:
          description: The group or device id, or the member id or `ext:` and the account's id for the member. Not set for the tenant.
          maxLength: 260
          minLength: 1
          type: string
      required:
        - target
        - levels
      type: object
    CatalogCond:
      description: 'A condition on another key of the payload. key is relative to the constrained key''s dictionary: "Name", "../Name" one level up, or "/Name" at the payload root. An unset key is compared by its default. Every field present must hold.'
      properties:
        in:
          items: {}
          type: array
        key:
          type: string
        not_in:
          items: {}
          type: array
        set:
          type: boolean
        title:
          type: string
      required:
        - key
        - title
      type: object
    CatalogEntry:
      properties:
        deprecated_os:
          type: string
        description:
          type: string
        group:
          enum:
            - apps
            - camera
            - messages
            - content
            - passcode
            - network
            - accounts
            - home
            - device
          type: string
        id:
          type: string
        keys:
          items:
            $ref: '#/components/schemas/CatalogKey'
          type: array
        kind:
          enum:
            - restriction
            - profile
            - declaration
          type: string
        levels:
          items:
            enum:
              - supervised
              - unsupervised
            type: string
          type: array
        min_os:
          type: string
        multiple:
          type: boolean
        title:
          type: string
        type:
          type: string
      required:
        - id
        - kind
        - type
        - title
        - description
        - group
        - levels
        - keys
      type: object
    CatalogKey:
      properties:
        default: {}
        deprecated_os:
          type: string
        description:
          type: string
        excludes:
          description: Sibling keys this key cannot be set with.
          items:
            type: string
          type: array
        format:
          description: Apple's subtype of a string key; the server checks values against it.
          enum:
            - url
            - hostname
          type: string
        items:
          $ref: '#/components/schemas/CatalogKey'
        keys:
          items:
            $ref: '#/components/schemas/CatalogKey'
          type: array
        levels:
          items:
            enum:
              - supervised
              - unsupervised
            type: string
          type: array
        min_os:
          type: string
        name:
          type: string
        options:
          items:
            $ref: '#/components/schemas/CatalogOption'
          type: array
        range:
          $ref: '#/components/schemas/CatalogRange'
        required:
          type: boolean
        required_when:
          description: The key is required while every condition holds.
          items:
            $ref: '#/components/schemas/CatalogCond'
          type: array
        secret:
          type: boolean
        title:
          type: string
        type:
          enum:
            - string
            - integer
            - real
            - boolean
            - date
            - data
            - array
            - dictionary
            - any
          type: string
        when:
          description: The key applies only while every condition holds; set otherwise, the server refuses it.
          items:
            $ref: '#/components/schemas/CatalogCond'
          type: array
      required:
        - name
        - type
      type: object
    CatalogOption:
      properties:
        label:
          type: string
        value: {}
      required:
        - value
        - label
      type: object
    CatalogRange:
      properties:
        max:
          type: number
        min:
          type: number
      type: object
    CatalogResponse:
      properties:
        entries:
          items:
            $ref: '#/components/schemas/CatalogEntry'
          type: array
      required:
        - entries
      type: object
    Command:
      properties:
        command_uuid:
          format: uuid
          type: string
        created_at:
          format: date-time
          type: string
        error:
          description: The device's ErrorChain.
          items:
            additionalProperties: {}
            type: object
          type:
            - "null"
            - array
        request_type:
          type: string
        result:
          additionalProperties: {}
          description: The device's report without UDID, Status, CommandUUID, and ErrorChain. For DeviceInformation it carries QueryResponses, for DeviceLock MessageResult when present.
          type:
            - "null"
            - object
        status:
          description: 'A command starts in the first status listed and stays there until it is handed to the MDM server. cancelled: it was dropped without being sent, because its enrollment ended or a newer decision replaced it. It never reached the device.'
          enum:
            - outbox
            - cancelled
            - queued
            - acknowledged
            - error
            - command_format_error
            - notnow
          type: string
        updated_at:
          format: date-time
          type: string
      required:
        - command_uuid
        - request_type
        - status
        - result
        - error
        - created_at
        - updated_at
      type: object
    CommandAccepted:
      properties:
        command_uuid:
          format: uuid
          type: string
      required:
        - command_uuid
      type: object
    CommandRequest:
      properties:
        message:
          description: DeviceLock only.
          maxLength: 1000
          type: string
        phone_number:
          description: DeviceLock only.
          maxLength: 64
          type: string
        type:
          enum:
            - DeviceLock
            - DeviceInformation
          type: string
      required:
        - type
      type: object
    CreateDeviceRequest:
      properties:
        member:
          description: 'The member who owns the device: a member id, or `ext:` and the account''s id for the member. Without it the device is the tenant''s.'
          maxLength: 260
          minLength: 1
          type: string
        name:
          maxLength: 200
          minLength: 1
          type: string
        settings:
          $ref: '#/components/schemas/Policy'
      required:
        - name
      type: object
    DeclarationReason:
      properties:
        code:
          type: string
        description:
          type: string
      required:
        - code
      type: object
    DeclarationState:
      properties:
        active:
          type: boolean
        identifier:
          type: string
        reasons:
          items:
            $ref: '#/components/schemas/DeclarationReason'
          type: array
        reported_token:
          description: The version the device last reported. Null before it reports.
          type:
            - "null"
            - string
        server_token:
          description: The current version.
          type: string
        valid:
          description: Apple's value (valid, invalid, unknown), or unknown before a report.
          type: string
      required:
        - identifier
        - server_token
        - reported_token
        - active
        - valid
        - reasons
      type: object
    Device:
      properties:
        created_at:
          format: date-time
          type: string
        enrollment_id:
          description: The enrollment ID bound to this device.
          type:
            - "null"
            - string
        id:
          format: uuid
          type: string
        last_seen_at:
          format: date-time
          type:
            - "null"
            - string
        member_id:
          description: The member who owns the device. Null when it is the tenant's.
          format: uuid
          type:
            - "null"
            - string
        model:
          type:
            - "null"
            - string
        name:
          type: string
        os_behind:
          description: Below its tenant's minimum, or below os_latest when the tenant sets none.
          type: boolean
        os_latest:
          description: The newest iOS Apple publishes for its model, from the daily check.
          type:
            - "null"
            - string
        os_version:
          type:
            - "null"
            - string
        policy:
          $ref: '#/components/schemas/DevicePolicy'
        serial_number:
          type:
            - "null"
            - string
        settings:
          description: One status per policy item, in policy order. Empty without a policy.
          items:
            $ref: '#/components/schemas/ItemStatus'
          type: array
        status:
          enum:
            - pending
            - enrolling
            - enrolled
            - unenrolled
          type: string
        supervised:
          description: The level, from the current DeviceInformation IsSupervised. Null until reported, and again on each new enrollment until reported.
          type:
            - "null"
            - boolean
        udid:
          type:
            - "null"
            - string
      required:
        - id
        - member_id
        - name
        - status
        - enrollment_id
        - udid
        - serial_number
        - model
        - os_version
        - supervised
        - os_latest
        - os_behind
        - last_seen_at
        - created_at
        - policy
        - settings
      type: object
    DeviceDDM:
      properties:
        declarations:
          items:
            $ref: '#/components/schemas/DeclarationState'
          type: array
        stage:
          enum:
            - none
            - enabling
            - taking_over
            - enabled
          type: string
      required:
        - stage
        - declarations
      type: object
    DeviceMemberRequest:
      properties:
        member:
          description: The member id, or `ext:` and the account's id for the member.
          maxLength: 260
          minLength: 1
          type: string
      required:
        - member
      type: object
    DevicePolicy:
      description: 'The deployment of the device''s effective policy. Its items are read with profiles:read: GET .../effective-policy (with provenance) and GET .../settings (the device''s own).'
      properties:
        applied_level:
          description: The level of the declarations the device last reported active.
          enum:
            - supervised
            - unsupervised
            - null
          type:
            - "null"
            - string
        applied_revision:
          description: The revision the device last reported active. Null before that.
          format: int64
          type:
            - "null"
            - integer
        error:
          description: The declarations the device reported invalid, with Apple's reason, when status is failed.
          items:
            additionalProperties: {}
            type: object
          type:
            - "null"
            - array
        install_generation:
          description: Increments on every deploy, including a rebuild for a changed level.
          format: int64
          type: integer
        install_level:
          description: The level the current declarations were built for. Null before the first deploy.
          enum:
            - supervised
            - unsupervised
            - null
          type:
            - "null"
            - string
        revision:
          description: The effective policy's revision. Increments whenever the merged result changes.
          format: int64
          type: integer
        status:
          enum:
            - pending
            - applied
            - failed
            - removing
          type: string
      required:
        - revision
        - status
        - install_level
        - install_generation
        - applied_revision
        - applied_level
        - error
      type:
        - object
        - "null"
    EffectiveItem:
      properties:
        conflicts:
          description: Sources in the same layer that set the same item and lost to the lower profile id.
          items:
            $ref: '#/components/schemas/Source'
          type: array
        item:
          $ref: '#/components/schemas/PolicyItem'
        overridden:
          description: Less specific sources (or lower priority groups) that set the same item.
          items:
            $ref: '#/components/schemas/Source'
          type: array
        source:
          $ref: '#/components/schemas/Source'
      required:
        - item
        - source
        - overridden
        - conflicts
      type: object
    EffectivePolicy:
      properties:
        items:
          description: Empty while the policy is being removed.
          items:
            $ref: '#/components/schemas/EffectiveItem'
          type: array
        revision:
          description: The effective policy's revision. Absent when the device has none.
          format: int64
          type: integer
        status:
          description: Absent when the device has no policy.
          enum:
            - pending
            - applied
            - failed
            - removing
          type: string
      required:
        - items
      type: object
    EnrollmentLinkResponse:
      properties:
        device:
          $ref: '#/components/schemas/Device'
        enrollment_profile:
          description: The unsigned .mobileconfig the link serves, base64 encoded.
          format: byte
          type: string
        expires_at:
          format: date-time
          type: string
        url:
          description: The public link. Treat it as a secret until it expires.
          format: uri
          type: string
      required:
        - device
        - url
        - expires_at
        - enrollment_profile
      type: object
    EnrollmentResponse:
      properties:
        device:
          $ref: '#/components/schemas/Device'
        enrollment_profile:
          description: The unsigned .mobileconfig, base64 encoded.
          format: byte
          type: string
      required:
        - device
        - enrollment_profile
      type: object
    FieldError:
      properties:
        detail:
          type: string
        field:
          type: string
      required:
        - field
        - detail
      type: object
    Group:
      properties:
        created_at:
          format: date-time
          type: string
        id:
          format: uuid
          type: string
        name:
          type: string
        priority:
          type: integer
        updated_at:
          format: date-time
          type: string
      required:
        - id
        - name
        - priority
        - created_at
        - updated_at
      type: object
    GroupRequest:
      properties:
        name:
          maxLength: 200
          minLength: 1
          type: string
        priority:
          description: Unique in the tenant. The higher priority wins between groups.
          maximum: 10000
          minimum: 0
          type: integer
      required:
        - name
        - priority
      type: object
    GroupUpdate:
      minProperties: 1
      properties:
        name:
          maxLength: 200
          minLength: 1
          type: string
        priority:
          maximum: 10000
          minimum: 0
          type: integer
      type: object
    ItemStatus:
      properties:
        id:
          type: string
        key:
          type:
            - "null"
            - string
        min_os:
          description: The iOS version the item needs, with reason requires_os.
          type:
            - "null"
            - string
        reason:
          description: Set when status is unsupported.
          enum:
            - requires_os
            - requires_supervision
            - not_supported_by_device
            - null
          type:
            - "null"
            - string
        ref:
          description: The item's id, or id#key for an item added more than once.
          type: string
        status:
          description: 'Derived, first match wins: level or OS unknown, pending; OS below 17, unsupported; the item needs supervision or a newer OS, or every key it sets does, unsupported; policy removing, removing; the device''s capabilities lack its declaration type, unsupported; the item''s declarations reported for this revision, their state; policy applied for this revision and level, applied; otherwise pending.'
          enum:
            - pending
            - applied
            - failed
            - removing
            - unsupported
          type: string
      required:
        - ref
        - id
        - key
        - status
        - reason
        - min_os
      type: object
    Licence:
      properties:
        devices_used:
          minimum: 0
          type: integer
        ends_at:
          description: When the licence expires; null is never. After it, adding devices, profiles, settings, assignments, members, and groups answers 409 licence_expired. Reads, removals, and DeviceLock keep working.
          format: date-time
          type:
            - "null"
            - string
        expired:
          type: boolean
        max_devices:
          description: Registered and enrolled devices allowed; null is no limit. Adding one over it answers 409 licence_exceeded.
          minimum: 0
          type:
            - "null"
            - integer
        max_people:
          description: Organization members plus open invitations allowed; null is no limit.
          minimum: 0
          type:
            - "null"
            - integer
        people_used:
          description: Members of the tenant's organization and open invitations; null when the members could not be counted (Auth0 failed or timed out), so the use is unknown rather than understated.
          minimum: 0
          type:
            - "null"
            - integer
      required:
        - max_devices
        - max_people
        - ends_at
        - expired
        - devices_used
        - people_used
      type: object
    Me:
      properties:
        account:
          $ref: '#/components/schemas/AccountRef'
        kind:
          enum:
            - tenant_admin
            - account_admin
            - account_client
            - delegated
            - platform_admin
          type: string
        role:
          description: For tenant_admin and account_admin.
          enum:
            - owner
            - admin
            - viewer
          type: string
        signed_in_at:
          description: For platform_admin, when the second-factor sign-in happened.
          format: date-time
          type: string
        tenant:
          $ref: '#/components/schemas/Tenant'
      required:
        - kind
      type: object
    Member:
      properties:
        created_at:
          format: date-time
          type: string
        external_id:
          type: string
        groups:
          description: The ids of the member's groups.
          items:
            format: uuid
            type: string
          type: array
        id:
          format: uuid
          type: string
        name:
          type: string
        updated_at:
          format: date-time
          type: string
      required:
        - id
        - name
        - groups
        - created_at
        - updated_at
      type: object
    MemberRequest:
      properties:
        external_id:
          description: 'The account''s own id for the person: letters, digits, and the characters . _ ~ @ : -'
          maxLength: 255
          minLength: 1
          pattern: ^[A-Za-z0-9._~@:-]+$
          type: string
        name:
          maxLength: 200
          minLength: 1
          type: string
      required:
        - name
      type: object
    MemberUpdate:
      minProperties: 1
      properties:
        external_id:
          maxLength: 255
          minLength: 1
          pattern: ^[A-Za-z0-9._~@:-]+$
          type: string
        name:
          maxLength: 200
          minLength: 1
          type: string
      type: object
    Policy:
      description: 'Settings: items from the catalog (GET /api/v1/catalog). Items a device''s level or OS cannot take are left out of its declarations and reported unsupported. Secret keys (marked in the catalog) are write-only: responses show {"secret": "set"}; a PUT that sends it keeps the stored value, a string replaces it, and leaving the key out clears it.'
      properties:
        items:
          items:
            $ref: '#/components/schemas/PolicyItem'
          maxItems: 500
          type: array
      required:
        - items
      type: object
    PolicyItem:
      properties:
        id:
          description: A catalog entry id, such as restriction:allowCamera.
          type: string
        key:
          description: Names the instance of an entry that can be added more than once (multiple), such as one Wi-Fi network.
          pattern: ^[a-z0-9][a-z0-9-]{0,39}$
          type: string
        payload:
          additionalProperties: {}
          description: A profile payload's or declaration's keys, as the catalog describes them. Data keys are base64.
          type: object
        value:
          description: A restriction's value.
      required:
        - id
      type: object
    Problem:
      description: RFC 9457 problem detail.
      properties:
        code:
          description: Names the problem; branch on it, not on status or title.
          type: string
        detail:
          type: string
        errors:
          items:
            $ref: '#/components/schemas/FieldError'
          type: array
        instance:
          description: urn:request:<id>, the request's id; quote it when reporting a problem.
          type: string
        status:
          type: integer
        title:
          type: string
        type:
          type: string
      required:
        - type
        - title
        - status
      type: object
    Profile:
      properties:
        created_at:
          format: date-time
          type: string
        id:
          description: A UUIDv7. Within one layer the lower id wins a conflict.
          format: uuid
          type: string
        items:
          items:
            $ref: '#/components/schemas/PolicyItem'
          type: array
        name:
          type: string
        updated_at:
          format: date-time
          type: string
      required:
        - id
        - name
        - items
        - created_at
        - updated_at
      type: object
    ProfileRequest:
      properties:
        items:
          items:
            $ref: '#/components/schemas/PolicyItem'
          maxItems: 500
          type: array
        name:
          maxLength: 200
          minLength: 1
          type: string
      required:
        - name
        - items
      type: object
    Source:
      properties:
        group_id:
          description: The group the profile reached the device through, for the group layer.
          format: uuid
          type: string
        layer:
          description: Where the item came from; settings is the device's own items.
          enum:
            - tenant
            - group
            - member
            - device
            - settings
          type: string
        profile_id:
          format: uuid
          type: string
      required:
        - layer
      type: object
    Tenant:
      properties:
        created_at:
          format: date-time
          type: string
        deleting_since:
          description: When its deletion started; null otherwise.
          format: date-time
          type:
            - "null"
            - string
        external_id:
          type: string
        holder_id:
          description: The tenant's credential holder; null when it uses the account's default.
          format: uuid
          type:
            - "null"
            - string
        id:
          format: uuid
          type: string
        licence:
          $ref: '#/components/schemas/Licence'
        min_os:
          description: The iOS version its devices must reach; null when the latest for each model.
          type:
            - "null"
            - string
        name:
          type: string
        role:
          description: The caller's role, for an admin app token only.
          enum:
            - owner
            - admin
            - viewer
          type: string
      required:
        - id
        - name
        - created_at
      type: object
    TenantRequest:
      properties:
        external_id:
          description: 'The account''s own id for the tenant: letters, digits, and the characters . _ ~ @ : -'
          maxLength: 255
          minLength: 1
          pattern: ^[A-Za-z0-9._~@:-]+$
          type: string
        holder_id:
          description: The credential holder whose Apple credentials the tenant uses; the account's default when absent.
          format: uuid
          type: string
        name:
          maxLength: 200
          minLength: 1
          type: string
      required:
        - name
      type: object
    TenantUpdate:
      minProperties: 1
      properties:
        holder_id:
          description: Moves the tenant to another credential holder of the account; enrolled devices keep their push topic.
          format: uuid
          type: string
        min_os:
          description: The iOS version its devices must reach (26.2); empty clears it. Without it a device is behind when Apple has a newer release for its model.
          maxLength: 20
          type: string
        name:
          maxLength: 200
          minLength: 1
          type: string
      type: object
  securitySchemes:
    bearerAuth:
      description: A delegated token from POST /api/v1/tokens, or an admin app sign-in.
      scheme: bearer
      type: http
    clientCredentials:
      description: An account client's Auth0 client-credentials token.
      flows:
        clientCredentials:
          scopes: {}
          tokenUrl: https://id.enroll.dev/oauth/token
      type: oauth2
info:
  description: Manage tenants, members, groups, devices, profiles, and commands for Apple devices. Errors are RFC 9457 problem+json; the code field names the problem.
  title: mdm API
  version: "1"
openapi: 3.1.0
paths:
  /api/v1/catalog:
    get:
      description: Every setting mdm can manage, from Apple's device-management schema (Release-v27.2). With level, only entries that level can take; with os too, only those that iOS version has. Keys carry their own level and version limits.
      operationId: getCatalog
      parameters:
        - in: query
          name: level
          schema:
            enum:
              - supervised
              - unsupervised
            type: string
        - in: query
          name: os
          schema:
            pattern: ^[0-9]{1,3}(\.[0-9]{1,3}){0,2}$
            type: string
        - description: 'For an account client: the user the client acts for, recorded in the audit trail. Ignored for other callers.'
          in: header
          name: Mdm-Actor
          schema:
            maxLength: 255
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogResponse'
          description: The entries.
        "400":
          content:
