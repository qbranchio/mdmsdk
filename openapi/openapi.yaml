webhooks:
  command.completed:
    post:
      description: The device acknowledged a command or reported an error. GET /api/v1/tenants/{tenant}/devices/{id}/commands/{command} returns its result. Sent as a POST to each of the account's enabled endpoints that takes the event, signed per Standard Webhooks 1.0.
      operationId: onCommandCompleted
      parameters:
        - description: The event's id, the same on every attempt. Dedupe on it.
          in: header
          name: webhook-id
          required: true
          schema:
            format: uuid
            type: string
        - description: When this attempt was sent, in seconds since the Unix epoch.
          in: header
          name: webhook-timestamp
          required: true
          schema:
            format: int64
            type: integer
        - description: 'One v1 signature per secret, space separated: HMAC-SHA256 over id.timestamp.body, base64. Two for 24 hours after a rotation, the new secret''s and the previous one''s.'
          in: header
          name: webhook-signature
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommandCompletedEvent'
        required: true
      responses:
        2XX:
          description: 'Received: any 2xx status. Any other status, or no answer in 10 seconds, is retried on the endpoint''s schedule; a Retry-After on 429, 502, or 504 is honoured, up to 24 hours.'
        "410":
          description: 'The endpoint is gone: it is disabled and gets nothing more.'
      summary: A command got its final answer
      tags:
        - events
  device.enrolled:
    post:
      description: The device completed enrollment and is managed. Sent as a POST to each of the account's enabled endpoints that takes the event, signed per Standard Webhooks 1.0.
      operationId: onDeviceEnrolled
      parameters:
        - description: The event's id, the same on every attempt. Dedupe on it.
          in: header
          name: webhook-id
          required: true
          schema:
            format: uuid
            type: string
        - description: When this attempt was sent, in seconds since the Unix epoch.
          in: header
          name: webhook-timestamp
          required: true
          schema:
            format: int64
            type: integer
        - description: 'One v1 signature per secret, space separated: HMAC-SHA256 over id.timestamp.body, base64. Two for 24 hours after a rotation, the new secret''s and the previous one''s.'
          in: header
          name: webhook-signature
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceEnrolledEvent'
        required: true
      responses:
        2XX:
          description: 'Received: any 2xx status. Any other status, or no answer in 10 seconds, is retried on the endpoint''s schedule; a Retry-After on 429, 502, or 504 is honoured, up to 24 hours.'
        "410":
          description: 'The endpoint is gone: it is disabled and gets nothing more.'
      summary: A device enrolled
      tags:
        - events
  device.os_behind:
