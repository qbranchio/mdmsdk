components:
  schemas:
    AccountRef:
      properties:
        id:
          format: uuid
          type: string
        name:
          type: string
      required:
        - id
        - name
      type: object
    CatalogCond:
      description: 'A condition on another key of the payload. key is relative to the constrained key''s dictionary: "Name", "../Name" one level up, or "/Name" at the payload root. An unset key is compared by its default. Every field present must hold.'
      properties:
        in:
          items: {}
          type: array
        key:
          type: string
        not_in:
          items: {}
          type: array
        set:
          type: boolean
        title:
          type: string
      required:
        - key
        - title
      type: object
    CatalogEntry:
      properties:
        deprecated_os:
          type: string
        description:
          type: string
        group:
          enum:
            - apps
            - camera
            - messages
            - content
            - passcode
            - network
            - accounts
            - home
            - device
          type: string
        id:
          type: string
        keys:
          items:
            $ref: '#/components/schemas/CatalogKey'
          type: array
        kind:
          enum:
            - restriction
            - profile
            - declaration
          type: string
        levels:
          items:
            enum:
              - supervised
              - unsupervised
            type: string
          type: array
        min_os:
          type: string
        multiple:
          type: boolean
        title:
          type: string
        type:
          type: string
      required:
        - id
        - kind
        - type
        - title
        - description
        - group
        - levels
        - keys
      type: object
    CatalogKey:
      properties:
        default: {}
        deprecated_os:
          type: string
        description:
          type: string
        excludes:
          description: Sibling keys this key cannot be set with.
          items:
            type: string
          type: array
        format:
          description: Apple's subtype of a string key; the server checks values against it.
          enum:
            - url
            - hostname
          type: string
        items:
          $ref: '#/components/schemas/CatalogKey'
        keys:
          items:
            $ref: '#/components/schemas/CatalogKey'
          type: array
        levels:
          items:
            enum:
              - supervised
              - unsupervised
            type: string
          type: array
        min_os:
          type: string
        name:
          type: string
        options:
          items:
            $ref: '#/components/schemas/CatalogOption'
          type: array
        range:
          $ref: '#/components/schemas/CatalogRange'
        required:
          type: boolean
        required_when:
          description: The key is required while every condition holds.
          items:
            $ref: '#/components/schemas/CatalogCond'
          type: array
        secret:
          type: boolean
        title:
          type: string
        type:
          enum:
            - string
            - integer
            - real
            - boolean
            - date
            - data
            - array
            - dictionary
            - any
          type: string
        when:
          description: The key applies only while every condition holds; set otherwise, the server refuses it.
          items:
            $ref: '#/components/schemas/CatalogCond'
          type: array
      required:
        - name
        - type
      type: object
    CatalogOption:
      properties:
        label:
          type: string
        value: {}
      required:
        - value
        - label
      type: object
    CatalogRange:
      properties:
        max:
          type: number
        min:
          type: number
      type: object
    CatalogResponse:
      properties:
        entries:
          items:
            $ref: '#/components/schemas/CatalogEntry'
          type: array
      required:
        - entries
      type: object
    FieldError:
      properties:
        detail:
          type: string
        field:
          type: string
      required:
        - field
        - detail
      type: object
    Licence:
      properties:
        devices_used:
          minimum: 0
          type: integer
        ends_at:
          description: When the licence expires; null is never. After it, adding devices, profiles, settings, assignments, members, and groups answers 409 licence_expired. Reads, removals, and DeviceLock keep working.
          format: date-time
          type:
            - "null"
            - string
        expired:
          type: boolean
        max_devices:
          description: Registered and enrolled devices allowed; null is no limit. Adding one over it answers 409 licence_exceeded.
          minimum: 0
          type:
            - "null"
            - integer
        max_people:
          description: Organization members plus open invitations allowed; null is no limit.
          minimum: 0
          type:
            - "null"
            - integer
        people_used:
          description: Members of the tenant's organization and open invitations; null when the members could not be counted (Auth0 failed or timed out), so the use is unknown rather than understated.
          minimum: 0
          type:
            - "null"
            - integer
      required:
        - max_devices
        - max_people
        - ends_at
        - expired
        - devices_used
        - people_used
      type: object
    Me:
      properties:
        account:
          $ref: '#/components/schemas/AccountRef'
        kind:
          enum:
            - tenant_admin
            - account_admin
            - account_client
            - delegated
            - platform_admin
          type: string
        role:
          description: For tenant_admin and account_admin.
          enum:
            - owner
            - admin
            - viewer
          type: string
        signed_in_at:
          description: For platform_admin, when the second-factor sign-in happened.
          format: date-time
          type: string
        tenant:
          $ref: '#/components/schemas/Tenant'
      required:
        - kind
      type: object
    Problem:
      description: RFC 9457 problem detail.
      properties:
        code:
          description: Names the problem; branch on it, not on status or title.
          type: string
        detail:
          type: string
        errors:
          items:
            $ref: '#/components/schemas/FieldError'
          type: array
        instance:
          description: urn:request:<id>, the request's id; quote it when reporting a problem.
          type: string
        status:
          type: integer
        title:
          type: string
        type:
          type: string
      required:
        - type
        - title
        - status
      type: object
    Tenant:
      properties:
        created_at:
          format: date-time
          type: string
        deleting_since:
          description: When its deletion started; null otherwise.
          format: date-time
          type:
            - "null"
            - string
        external_id:
          type: string
        holder_id:
          description: The tenant's credential holder; null when it uses the account's default.
          format: uuid
          type:
            - "null"
            - string
        id:
          format: uuid
          type: string
        licence:
          $ref: '#/components/schemas/Licence'
        min_os:
          description: The iOS version its devices must reach; null when the latest for each model.
          type:
            - "null"
            - string
        name:
          type: string
        role:
          description: The caller's role, for an admin app token only.
          enum:
            - owner
            - admin
            - viewer
          type: string
      required:
        - id
        - name
        - created_at
      type: object
  securitySchemes:
    bearerAuth:
      description: A delegated token from POST /api/v1/tokens, or an admin app sign-in.
      scheme: bearer
      type: http
    clientCredentials:
      description: An account client's Auth0 client-credentials token.
      flows:
        clientCredentials:
          scopes: {}
          tokenUrl: https://id.enroll.dev/oauth/token
      type: oauth2
info:
  description: Manage tenants, members, groups, devices, profiles, and commands for Apple devices. Errors are RFC 9457 problem+json; the code field names the problem.
  title: mdm API
  version: "1"
openapi: 3.1.0
paths:
  /api/v1/catalog:
    get:
      description: Every setting mdm can manage, from Apple's device-management schema (Release-v27.2). With level, only entries that level can take; with os too, only those that iOS version has. Keys carry their own level and version limits.
      operationId: getCatalog
      parameters:
        - in: query
          name: level
          schema:
            enum:
              - supervised
              - unsupervised
            type: string
        - in: query
          name: os
          schema:
            pattern: ^[0-9]{1,3}(\.[0-9]{1,3}){0,2}$
            type: string
        - description: 'For an account client: the user the client acts for, recorded in the audit trail. Ignored for other callers.'
          in: header
          name: Mdm-Actor
          schema:
            description: 'For an account client: the user the client acts for, recorded in the audit trail. Ignored for other callers.'
            maxLength: 255
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogResponse'
          description: The entries.
        "400":
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: The request could not be decoded or a parameter is malformed.
        "401":
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: The bearer token is missing or wrong.
        "403":
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: The caller reaches the resource but its scopes or role do not allow the operation.
        "429":
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: The caller is over its rate limit.
          headers:
            Retry-After:
              description: Seconds to wait.
              schema:
                type: integer
              style: simple
      security:
        - clientCredentials: []
        - bearerAuth: []
      summary: Settings a device can take
      tags:
        - catalog
  /api/v1/me:
    get:
      description: 'The kind of caller and what it reaches: an organization''s admin app user (its tenant and role), an account console user (the account and role), an account client, a delegated token (its tenant), or a platform admin (and when their second-factor sign-in happened).'
      operationId: getMe
      parameters:
        - description: 'For an account client: the user the client acts for, recorded in the audit trail. Ignored for other callers.'
          in: header
          name: Mdm-Actor
          schema:
            description: 'For an account client: the user the client acts for, recorded in the audit trail. Ignored for other callers.'
            maxLength: 255
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: The caller.
        "401":
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: The bearer token is missing or wrong.
        "403":
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: The caller reaches the resource but its scopes or role do not allow the operation.
        "429":
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: The caller is over its rate limit.
          headers:
            Retry-After:
              description: Seconds to wait.
              schema:
                type: integer
              style: simple
      security:
        - clientCredentials: []
        - bearerAuth: []
      summary: Who the caller is
      tags:
        - session
servers:
  - url: https://enroll.dev
