[project]
name = "mdmsdk"
version = "0.0.0"
description = "Python client for the mdm API: tenants, devices, profiles, and commands for Apple devices."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Q Branch" }]
requires-python = ">=3.11"
dependencies = [
  "httpx==0.29.0",
  "authlib==1.9.10",
  "tenacity==9.2.1",
  "standardwebhooks==1.3.0",
]

[project.urls]
Homepage = "https://github.com/qbranchio/mdmsdk"
Source = "https://github.com/qbranchio/mdmsdk"

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mdmsdk"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.pyright]
typeCheckingMode = "strict"
include = ["src"]
