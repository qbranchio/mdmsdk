name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - uses: golangci/golangci-lint-action@v8
      - run: go test -race -count=1 ./...

  python:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install -e . ruff==0.17.6 pyright==1.1.414 pytest==9.2.0
      - run: ruff check .
      - run: pyright
      - run: python -c "import mdmsdk; print(mdmsdk.__version__)"
