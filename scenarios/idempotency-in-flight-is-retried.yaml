name: 409 idempotency_in_flight on a keyed create is retried with the same key
call: {operation: createMember, args: {tenant: t1, body: {name: Kid}}}
responses:
  - status: 409
    headers: {Content-Type: application/problem+json}
    body: {type: about:blank, title: Conflict, status: 409, code: idempotency_in_flight}
  - status: 201
    headers: {Content-Type: application/json}
    body: {id: 00000000-0000-4000-8000-0000000000c1, name: Kid, groups: [], created_at: "2026-11-27T00:00:00Z", updated_at: "2026-11-27T00:00:00Z"}
expect:
  attempts: 2
  same_idempotency_key: true
  result: {id: 00000000-0000-4000-8000-0000000000c1, name: Kid, groups: [], created_at: "2026-11-27T00:00:00Z", updated_at: "2026-11-27T00:00:00Z"}
