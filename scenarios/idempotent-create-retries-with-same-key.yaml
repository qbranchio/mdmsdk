name: a create retried after a 503 sends the same Idempotency-Key on every attempt
call: {operation: createTenant, args: {body: {name: Acme}}}
responses:
  - status: 503
    headers: {Content-Type: application/problem+json}
    body: {type: about:blank, title: Service Unavailable, status: 503, code: auth0_unavailable}
  - status: 201
    headers: {Content-Type: application/json}
    body: {id: 00000000-0000-4000-8000-0000000000a1, name: Acme, created_at: "2026-11-27T00:00:00Z"}
expect:
  attempts: 2
  same_idempotency_key: true
  result: {id: 00000000-0000-4000-8000-0000000000a1, name: Acme, created_at: "2026-11-27T00:00:00Z"}
